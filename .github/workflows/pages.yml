name: Deploy OIDF explorer

on:
  push:
    branches: [main]
    paths:
      - "core_schemas/**"
      - "architectures/**"
      - "tooling/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install "jsonschema>=4.0" "pyyaml>=6.0"

      - name: Validate OIDF source
        run: |
          python tooling/validate_json_schemas.py core_schemas/idl
          python tooling/validate_front_door_schemas.py
          python tooling/validate_architecture_examples.py
          python -m unittest tooling.test_field_tooling tooling.test_oidf_canonical -v

      - name: Stage explorer + published format tree
        run: |
          set -euo pipefail
          mkdir -p public/schemas
          cp tooling/UI_mockups/commissioning_explorer.html public/index.html
          # Publish the whole format tree (schemas, IDL, evidence catalogs,
          # canonical dictionary, redacted examples) so every $id resolves.
          cp -R core_schemas/. public/schemas/
          # IDL $ids carry no "idl/" segment (SCHEMA-ID-NAMESPACES.md):
          # flatten the segment away, then drop the leftover directory.
          cp -R core_schemas/idl/. public/schemas/
          rm -rf public/schemas/idl
          find public/schemas -name README.md -delete
          # Apache-2.0 §4(d): carry the upstream NOTICE into the published copy.
          cp NOTICE public/NOTICE
          # Pages serves no directory listing, so /schemas/ would 404: publish a
          # browsable index + manifest of the identifier namespace.
          python tooling/gen_schema_index.py --out public/schemas/index.html
          test -f public/index.html
          test ! -e public/schemas/idl
          test ! -e public/schemas/README.md
          test -f public/NOTICE
          test -f public/schemas/index.html
          test -f public/schemas/manifest.json

      - name: Verify every published $id dereferences
        run: python tooling/verify_pages_ids.py --public public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
