name: JSON Schema CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "core_schemas/**"
      - "architectures/**"
      - "tooling/**"
      - ".github/workflows/json-schema.yml"

jobs:
  validate-json-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema + PyYAML
        run: python -m pip install "jsonschema>=4.0" "pyyaml>=6.0"

      - name: Validate IDL schemas
        run: python tooling/validate_json_schemas.py core_schemas/idl

      - name: Validate front-door schemas + site examples
        run: python tooling/validate_front_door_schemas.py

      - name: Validate architecture pack examples
        run: python tooling/validate_architecture_examples.py

      - name: Field tooling unit tests
        run: python -m unittest tooling.test_field_tooling -v

      - name: OIDF canonical dictionary + translator tests
        run: python -m unittest tooling.test_oidf_canonical -v
