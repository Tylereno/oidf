# Canonical equipment state machine (OIDF)
# Front-door YAML. Normative JSON Schema: idl/state/machine_definition.json
# Evidence types: evidence-catalog/equipment-lifecycle.json (CI-resolved)
# Status: lab — packs specialize SAT via architectures/*/sat_gate_map.json

id: oidf.equipment.canonical
version: "1.0.0"
subject_kind: Asset
initial_state: Procured
evidence_catalog: equipment-lifecycle

states:
  - Procured
  - Delivered
  - Installed
  - ReadyForCommission
  - Commissioned
  - Energized

terminal_states:
  - Energized

transitions:
  - id: procured_to_delivered
    from: Procured
    to: Delivered
    evidence_requirements:
      - evidence_type: DeliveryAccepted

  - id: delivered_to_installed
    from: Delivered
    to: Installed
    evidence_requirements:
      - evidence_type: MechanicalInstallComplete

  - id: installed_to_ready
    from: Installed
    to: ReadyForCommission
    evidence_requirements:
      - evidence_type: PreCommissionChecksPass

  - id: ready_to_commissioned
    from: ReadyForCommission
    to: Commissioned
    evidence_requirements:
      - evidence_type: SatSuitePass
        min_count: 1

  - id: commissioned_to_energized
    from: Commissioned
    to: Energized
    evidence_requirements:
      - evidence_type: EnergizationClearance

# Pack SAT specialization of SatSuitePass (ReadyForCommission → Commissioned).
# Each pack_id MUST have architectures/<pack_id>/sat_gate_map.json with at least
# one gate whose ledger_transition is "ReadyForCommission -> Commissioned".
# Concrete evidence_types on those gates resolve against cited catalogs in CI.
pack_sat_specialization:
  transition_id: ready_to_commissioned
  umbrella_evidence_type: SatSuitePass
  ledger_transition: "ReadyForCommission -> Commissioned"
  packs:
    - ev_fleet_btm
    - hyperscale_island
    - remote_resilient_microgrid

notes: |
  Humans may approve policy; they must not click state forward without Evidence.
  Packs specialize SatSuitePass via sat_gate_map.json + concrete catalogs
  (bess-commissioning, solar-inverter-commissioning, *-local). Project machines
  MAY pin those catalogs for commissioning while retaining this state vocabulary.
